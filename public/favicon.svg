<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- Gradiente de fondo (Estilo moderno) -->
    <linearGradient id="NoteHubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9333ea;stop-opacity:1" /> <!-- Morado -->
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1" /> <!-- Índigo -->
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Base redondeada (Estilo iOS/macOS) -->
  <rect width="1024" height="1024" rx="225" ry="225" fill="url(#NoteHubGrad)" />

  <!-- Letra "N" estilizada -->
  <!-- Pilar izquierdo -->
  <rect x="280" y="280" width="110" height="464" rx="40" fill="#ffffff" filter="url(#shadow)" />
  
  <!-- Diagonal (hoja doblada) -->
  <path d="M 335 320 L 710 744 L 640 760 L 290 320 Z" fill="#e0e7ff" opacity="0.9" />
  
  <!-- Pilar derecho -->
  <rect x="634" y="280" width="110" height="464" rx="40" fill="#ffffff" filter="url(#shadow)" />

  <!-- El "Hub" (Un acento visual naranja/amarillo) -->
  <circle cx="750" cy="270" r="45" fill="#fbbf24" filter="url(#shadow)" />
</svg>
